name: argus-iris
services:
  iris:
    build: .
    init: true
    command: ["--check-caps", "false", "--after", "/opt/argus/scripts/startup.sh"]
    ports:
      - "127.0.0.1:52773:52773"
    environment:
      ARGUS_LLM_MODE: ${ARGUS_LLM_MODE:-auto}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARGUS_LLM_MODEL: ${ARGUS_LLM_MODEL:-gpt-4.1-mini}
      ARGUS_TIMEZONE: ${ARGUS_TIMEZONE:-America/Sao_Paulo}
    volumes:
      - argus-evidence:/usr/irissys/mgr/argus
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/argus-ready && iris qlist IRIS"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
volumes:
  argus-evidence:
